[project]
name = "job-finder"
version = "0.1.0"
description = "Opportunity radar: collects jobs from public ATS APIs, scores them against my priorities, and sends a Telegram digest."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tools", "tests"]
mypy_path = "tools"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
